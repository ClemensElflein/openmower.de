services:
  website:
    image: klakegg/hugo:0.111.3-ext-ubuntu
    restart: on-failure
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /tmp/.npm
        chown -R 1000:1000 /tmp/.npm
        # Hugo is supplied by the image; only install the theme's runtime assets.
        npm install --ignore-scripts
        npm --prefix themes/docsy install --omit=dev --ignore-scripts
        scripts/gen-doc-versions.sh
        exec hugo server --config config.toml,config/_generated_versions.toml --bind 0.0.0.0 --liveReloadPort 8080 --poll 1s
    volumes:
      - .:/src
    ports:
      - "1313:1313"
  reverse-proxy:
    image: nginx:alpine
    restart: on-failure
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
